name: Auto Daily Commit

on:
  schedule:
    # Run every 10 minutes for testing
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create daily update
        run: |
          # Get current date and time
          DATETIME=$(date '+%Y-%m-%d %H:%M:%S')

          # Create DAILY_LOG.md if it doesn't exist
          if [ ! -f "DAILY_LOG.md" ]; then
            echo "# Daily Activity Log" > DAILY_LOG.md
            echo "" >> DAILY_LOG.md
          fi

          # Add timestamp log
          echo "- $DATETIME: Automated update" >> DAILY_LOG.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "chore: automated update $(date '+%Y-%m-%d %H:%M:%S')"
          git push

      - name: No changes message
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "No changes to commit today."
